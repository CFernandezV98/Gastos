<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gastos">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151816" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Mis Gastos</title>
<style>
:root{
  --bg:#f4f2ee; --card:#ffffff; --ink:#1d211f; --muted:#6c716d; --line:#e4e1da;
  --soft:#efece6; --accent:#1f2a24; --accent-ink:#ffffff; --danger:#c0392b;
  --c1:#3d6fd6; --c2:#8a4fc7; --c3:#b5682b; --pos:#23854f;
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#151816; --card:#1f2320; --ink:#ecebe7; --muted:#9a9f9b; --line:#2f3430;
    --soft:#272c28; --accent:#e9e6de; --accent-ink:#151816; --danger:#ef6b5b;
    --c1:#6b93ea; --c2:#b48ae8; --c3:#d98a4b; --pos:#5fc48b;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  min-height:100vh;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hidden{display:none !important}

/* Encabezado con selector de mes */
.top{
  position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.top h1{font-size:20px;margin:0;font-weight:700;text-align:center;flex:1}
.icon-btn{
  width:40px;height:40px;border-radius:50%;border:0;background:var(--card);
  display:grid;place-items:center;font-size:22px;line-height:1;
}
.icon-btn:disabled{opacity:.35}

main{padding:4px 16px 24px;max-width:560px;margin:0 auto}
.view{display:none}
.view.on{display:block}

.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.label{font-size:13px;color:var(--muted);margin:0 0 4px}
.big{font-size:38px;font-weight:700;letter-spacing:-.5px;margin:0}
.sub-line{font-size:14px;color:var(--muted);margin-top:4px}

.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--soft);margin:14px 0 10px}
.stack span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend i,.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}

.cat-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.cat-head h2{font-size:17px;margin:0;display:flex;align-items:center}
.cat-head .amt{font-size:17px;font-weight:700}
.pct{font-size:13px;color:var(--muted);margin:2px 0 10px}
.row{margin:10px 0 0}
.row-top{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.bar{height:6px;border-radius:3px;background:var(--soft);margin-top:5px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:3px}
.empty{font-size:14px;color:var(--muted);margin:6px 0 0}

.days svg{width:100%;height:auto;display:block}
.days .lbl{font-size:10px;fill:var(--muted)}

.btn{
  display:block;width:100%;border:0;border-radius:12px;padding:14px 16px;
  background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;
}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger)}
.btn + .btn{margin-top:8px}

.notice{font-size:14px;background:var(--soft);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.notice button{border:0;background:none;color:inherit;text-decoration:underline;padding:0;font-weight:600}

/* Movimientos */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;border-radius:20px;padding:7px 14px;background:var(--card);white-space:nowrap;font-size:14px}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.day-h{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:16px 4px 6px;text-transform:capitalize}
.list{background:var(--card);border-radius:var(--radius);overflow:hidden}
.item{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;
  padding:12px 14px;border-top:1px solid var(--line);
}
.item:first-child{border-top:0}
.item .sw{width:4px;align-self:stretch;border-radius:2px;flex:none}
.item .txt{flex:1;min-width:0}
.item .t1{font-weight:600;font-size:15px}
.item .t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:600}

/* Ajustes */
.subs{list-style:none;margin:10px 0 0;padding:0}
.subs li{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.subs li .n{flex:1}
.link{border:0;background:none;padding:4px 6px;font-size:14px;color:var(--muted)}
.link.del{color:var(--danger)}
.add-sub{display:flex;gap:8px;margin-top:10px}
.add-sub input{flex:1}
.add-sub button{border:0;border-radius:10px;padding:0 14px;background:var(--soft);font-weight:600}
input[type=text],input[type=date],input[inputmode],select,textarea{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;
  background:var(--bg);font-size:16px;
}
textarea{resize:none}
.p{font-size:14px;color:var(--muted);margin:0 0 12px}

/* Botón para agregar */
.fab{
  position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:6;
  width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);
  font-size:32px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.18);
}

/* Barra de pestañas */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
}
.tabs button{flex:1;border:0;background:none;padding:6px 0;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--ink);font-weight:600}

/* Formulario de gasto */
dialog{
  border:0;padding:0;width:100%;max-width:560px;margin:auto auto 0;border-radius:20px 20px 0 0;
  background:var(--card);color:var(--ink);max-height:92vh;
}
dialog::backdrop{background:rgba(0,0,0,.4)}
.sheet{padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-h h3{margin:0;font-size:18px}
.amount-in{font-size:30px !important;font-weight:700;text-align:center;padding:10px !important}
.field{margin-top:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 4px;font-size:14px;font-weight:600}
.seg button.on{border-color:var(--cc);color:var(--cc)}
.field label.opt{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--bg);font-size:15px;color:var(--ink);line-height:1.3}
.opt input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--accent)}
.opt .dot{margin-right:0}
.opt .r{margin-left:auto;font-size:14px}
.sheet .actions{margin-top:18px}

.pos{color:var(--pos)}
.neg{color:var(--danger)}
.ledger{margin-top:14px}
.ledger>div{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.ledger>div.tot{font-weight:700;border-top:1.5px solid var(--ink)}
.estado{display:inline-block;font-weight:700;font-size:15px;padding:4px 10px;border-radius:8px;background:var(--soft);margin-top:10px}
.hist{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:9px 10px;font-size:13px;margin-top:10px;align-items:baseline}
.hist .h{color:var(--muted);font-size:12px}
.hist .r{text-align:right}
.field label.opt.off{opacity:.45}
.toast{
  position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:12px;font-size:14px;
  z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;
}
.toast.on{opacity:1}
</style>
</head>
<body>

<header class="top" id="top">
  <button class="icon-btn" id="prev" aria-label="Mes anterior">‹</button>
  <h1 id="month-title">Mes</h1>
  <button class="icon-btn" id="next" aria-label="Mes siguiente">›</button>
</header>

<main>
  <section class="view on" id="v-inicio"></section>
  <section class="view" id="v-balance"></section>
  <section class="view" id="v-movs"></section>
  <section class="view" id="v-ajustes"></section>
</main>

<button class="fab" id="fab" aria-label="Agregar gasto">+</button>

<nav class="tabs">
  <button data-view="inicio" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Resumen
  </button>
  <button data-view="balance">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M7 21h10M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0z"/></svg>Balance
  </button>
  <button data-view="movs">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Movimientos
  </button>
  <button data-view="ajustes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes
  </button>
</nav>

<dialog id="dlg">
  <form class="sheet" id="f-gasto" method="dialog" autocomplete="off">
    <div class="sheet-h">
      <h3 id="dlg-title">Nuevo gasto</h3>
      <button type="button" class="icon-btn" id="dlg-close" aria-label="Cerrar">×</button>
    </div>
    <div class="seg" id="f-tipo" style="margin-bottom:12px"></div>
    <input id="f-monto" class="amount-in num" inputmode="decimal" placeholder="Q0.00" required>
    <div class="field" id="f-wrap-cat">
      <label>Categoría</label>
      <div class="seg" id="f-cats"></div>
    </div>
    <div class="field" id="f-wrap-sub">
      <label for="f-sub">Subcategoría</label>
      <select id="f-sub"></select>
    </div>
    <div class="field hidden" id="f-wrap-fuente">
      <label for="f-fuente">Fuente</label>
      <select id="f-fuente"></select>
    </div>
    <div class="field">
      <label for="f-fecha">Fecha</label>
      <input type="date" id="f-fecha" required>
    </div>
    <div class="field">
      <label for="f-nota">Nota (opcional)</label>
      <input type="text" id="f-nota" maxlength="120" placeholder="Ej. almuerzo con cliente">
    </div>
    <div class="actions">
      <button type="submit" class="btn">Guardar</button>
      <button type="button" class="btn danger hidden" id="f-del">Eliminar gasto</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-pdf"><form class="sheet" id="f-pdf" autocomplete="off"></form></dialog>
<dialog id="dlg-monto"><form class="sheet" id="f-saldo" autocomplete="off"></form></dialog>
<dialog id="dlg-setup"><form class="sheet" id="f-setup" autocomplete="off"></form></dialog>

<input type="file" id="import-file" accept=".json,application/json" class="hidden">
<div class="toast" id="toast"></div>

<script src="jspdf.umd.min.js"></script>
<script>
'use strict';

/* ---------- Datos ---------- */
const KEY = 'misgastos.datos.v1';
const KEY_LAST = 'misgastos.ultimo.v1';
// Los colores van por posición (1.ª, 2.ª y 3.ª categoría), no por nombre.
const CAT_VAR = ['--c1', '--c2', '--c3'];
const CAT_PDF = [[61,111,214], [138,79,199], [181,104,43]];
const idx = (catId) => Math.max(0, db.cats.findIndex(c => c.id === catId));

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function datosIniciales() {
  const s = (n) => ({ id: uid(), nombre: n });
  return normalizar({
    version: 1,
    cats: [
      { id: 'c1', nombre: 'Categoría 1', subs: ['General'].map(s) },
      { id: 'c2', nombre: 'Categoría 2', subs: ['General'].map(s) },
      { id: 'c3', nombre: 'Categoría 3', subs: ['General'].map(s) }
    ],
    configurado: false,
    gastos: [],
    ultimoRespaldo: null
  });
}

// Completa los campos de ingresos y balance en datos de versiones anteriores.
function normalizar(d) {
  if (!Array.isArray(d.ingresos)) d.ingresos = [];
  if (!Array.isArray(d.fuentes) || !d.fuentes.length)
    d.fuentes = ['Salario', 'Ventas', 'Otros'].map(n => ({ id: uid(), nombre: n }));
  if (d.saldoInicial === undefined) d.saldoInicial = null;
  if (!d.saldosReales || typeof d.saldosReales !== 'object') d.saldosReales = {};
  return d;
}

function valido(d) {
  return d && Array.isArray(d.cats) && d.cats.length === 3 && Array.isArray(d.gastos) &&
    d.cats.every(c => c.id && Array.isArray(c.subs));
}

function cargar() {
  try {
    const s = localStorage.getItem(KEY);
    if (s) {
      const d = JSON.parse(s);
      if (valido(d)) {
        if (d.configurado === undefined) d.configurado = d.cats.some(c => !/^Categoría \d$/.test(c.nombre));
        return normalizar(d);
      }
    }
  } catch (e) {}
  return datosIniciales();
}

let db = cargar();

function guardar() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast('No se pudo guardar en el teléfono'); }
}

// Pide a iOS que no borre los datos por falta de espacio.
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* ---------- Utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'];

function q(cent) {
  return (cent < 0 ? '-' : '') + 'Q' + (Math.abs(cent) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function qs(cent) { return (cent > 0 ? '+' : '') + q(cent); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function hoyISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function claveMes(y, m) { return y + '-' + String(m + 1).padStart(2, '0'); }
function nombreMes(y, m) { return MESES[m].charAt(0).toUpperCase() + MESES[m].slice(1) + ' ' + y; }
function color(catId) { return getComputedStyle(document.documentElement).getPropertyValue(CAT_VAR[idx(catId)]).trim(); }
function cat(id) { return db.cats.find(c => c.id === id); }
function subNombre(c, subId) { const s = c && c.subs.find(x => x.id === subId); return s ? s.nombre : 'Sin subcategoría'; }
function pct(a, b) { return b ? Math.round(a * 1000 / b) / 10 : 0; }

// Acepta "125", "125.50", "1,250.00" y también "125,50" (coma decimal).
function leerMonto(txt) {
  let s = String(txt).trim().replace(/[Qq\s]/g, '');
  if (/^\d+,\d{1,2}$/.test(s)) s = s.replace(',', '.');
  else s = s.replace(/,/g, '');
  if (!/^\d*\.?\d*$/.test(s) || s === '' || s === '.') return null;
  const c = Math.round(parseFloat(s) * 100);
  return c > 0 ? c : null;
}

// Para saldos: acepta cero y negativos ("-500").
function leerSaldo(txt) {
  let s = String(txt).trim().replace(/[Qq\s]/g, '');
  const neg = s.startsWith('-');
  s = s.replace(/^-/, '');
  if (/^0+([.,]0*)?$/.test(s)) return 0;
  const c = leerMonto(s);
  return c === null ? null : (neg ? -c : c);
}

let tToast;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(tToast); tToast = setTimeout(() => t.classList.remove('on'), 2200);
}

/* ---------- Estado de la vista ---------- */
const ahora = new Date();
let vista = 'inicio';
let anio = ahora.getFullYear(), mes = ahora.getMonth();
let filtro = 'todas';

function gastosDelMes(y = anio, m = mes) {
  const k = claveMes(y, m);
  return db.gastos.filter(g => g.fecha.startsWith(k));
}

function totales(lista) {
  const r = { total: 0, n: lista.length, cats: {} };
  db.cats.forEach(c => { r.cats[c.id] = { total: 0, n: 0, subs: {} }; });
  lista.forEach(g => {
    const rc = r.cats[g.cat]; if (!rc) return;
    r.total += g.montoC; rc.total += g.montoC; rc.n++;
    const s = rc.subs[g.sub] || (rc.subs[g.sub] = { total: 0, n: 0 });
    s.total += g.montoC; s.n++;
  });
  return r;
}

/* ---------- Ingresos y balance ---------- */
function ingresosDelMes(y = anio, m = mes) {
  const k = claveMes(y, m);
  return db.ingresos.filter(i => i.fecha.startsWith(k));
}
function fuente(id) { return db.fuentes.find(f => f.id === id); }
function fuenteNombre(id) { const f = fuente(id); return f ? f.nombre : 'Sin fuente'; }
function esMesActual() { return anio === ahora.getFullYear() && mes === ahora.getMonth(); }
const mesDe = (fecha) => fecha.slice(0, 7);

// Mes desde el que se acumula el saldo: el del saldo inicial, o el primer mes con movimientos.
function mesInicio() {
  if (db.saldoInicial) return db.saldoInicial.mes;
  const meses = db.gastos.concat(db.ingresos).map(x => mesDe(x.fecha)).sort();
  return meses[0] || claveMes(ahora.getFullYear(), ahora.getMonth());
}

function balance(y = anio, m = mes) {
  const k = claveMes(y, m), ini = mesInicio();
  const ing = ingresosDelMes(y, m).reduce((a, i) => a + i.montoC, 0);
  const gas = gastosDelMes(y, m).reduce((a, g) => a + g.montoC, 0);
  let apertura = null;
  if (k >= ini) {
    apertura = db.saldoInicial ? db.saldoInicial.montoC : 0;
    db.ingresos.forEach(i => { const mm = mesDe(i.fecha); if (mm >= ini && mm < k) apertura += i.montoC; });
    db.gastos.forEach(g => { const mm = mesDe(g.fecha); if (mm >= ini && mm < k) apertura -= g.montoC; });
  }
  const final = apertura === null ? null : apertura + ing - gas;
  const r = db.saldosReales[k];
  const real = r ? r.montoC : null;
  return { k, ini, apertura, ing, gas, neto: ing - gas, final, real, realFecha: r ? r.fecha : null,
    dif: real !== null && final !== null ? real - final : null };
}

function porFuente(lista) {
  const r = {};
  lista.forEach(i => { const x = r[i.fuente] || (r[i.fuente] = { total: 0, n: 0 }); x.total += i.montoC; x.n++; });
  return Object.entries(r).sort((a, b) => b[1].total - a[1].total);
}

function nombreClave(k) { const [y, m] = k.split('-').map(Number); return MESES[m - 1] + ' ' + y; }

/* ---------- Render ---------- */
function render() {
  $('#month-title').textContent = nombreMes(anio, mes);
  $('#next').disabled = esMesActual();
  $('#top').classList.toggle('hidden', vista === 'ajustes');
  $('#fab').classList.toggle('hidden', vista === 'ajustes');
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + vista));
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.view === vista));
  if (vista === 'inicio') renderInicio();
  if (vista === 'balance') renderBalance();
  if (vista === 'movs') renderMovs();
  if (vista === 'ajustes') renderAjustes();
}

function renderInicio() {
  const lista = gastosDelMes();
  const t = totales(lista);
  const pm = mes === 0 ? [anio - 1, 11] : [anio, mes - 1];
  const tAnt = totales(gastosDelMes(pm[0], pm[1])).total;
  let h = '';

  // Recordatorio de respaldo
  if (db.gastos.length || db.ingresos.length) {
    const dias = db.ultimoRespaldo ? Math.floor((Date.now() - db.ultimoRespaldo) / 864e5) : null;
    if (dias === null || dias >= 30) {
      h += `<div class="notice">${dias === null ? 'Aún no has hecho una copia de seguridad.' : 'Tu última copia de seguridad tiene ' + dias + ' días.'}
        <button data-act="respaldo">Hacer copia ahora</button></div>`;
    }
  }

  let comp = '';
  if (tAnt > 0) {
    const dif = t.total - tAnt;
    comp = dif === 0 ? `Igual que ${MESES[pm[1]]}` :
      `${q(Math.abs(dif))} ${dif > 0 ? 'más' : 'menos'} que ${MESES[pm[1]]}`;
  }
  h += `<div class="card">
    <p class="label">Total gastado</p>
    <p class="big num">${q(t.total)}</p>
    <div class="sub-line">${t.n} ${t.n === 1 ? 'gasto' : 'gastos'}${comp ? ' · ' + comp : ''}</div>`;
  if (t.total > 0) {
    h += '<div class="stack">' + db.cats.map(c =>
      `<span style="width:${t.cats[c.id].total * 100 / t.total}%;background:${color(c.id)}"></span>`).join('') + '</div>';
    h += '<div class="legend">' + db.cats.map(c =>
      `<span><i style="background:${color(c.id)}"></i>${esc(c.nombre)} ${pct(t.cats[c.id].total, t.total)}%</span>`).join('') + '</div>';
  }
  h += '</div>';

  db.cats.forEach(c => {
    const tc = t.cats[c.id];
    h += `<div class="card">
      <div class="cat-head"><h2><span class="dot" style="background:${color(c.id)}"></span>${esc(c.nombre)}</h2>
      <span class="amt num">${q(tc.total)}</span></div>
      <div class="pct">${tc.n} ${tc.n === 1 ? 'gasto' : 'gastos'}${t.total ? ' · ' + pct(tc.total, t.total) + '% del mes' : ''}</div>`;
    const filas = Object.entries(tc.subs).sort((a, b) => b[1].total - a[1].total);
    if (!filas.length) h += '<p class="empty">Sin gastos este mes.</p>';
    filas.forEach(([sid, s]) => {
      h += `<div class="row"><div class="row-top"><span>${esc(subNombre(c, sid))}</span><span class="num">${q(s.total)}</span></div>
        <div class="bar"><span style="width:${s.total * 100 / tc.total}%;background:${color(c.id)}"></span></div></div>`;
    });
    h += '</div>';
  });

  if (t.total > 0) h += renderDias(lista);

  h += `<button class="btn" data-act="pdf">Descargar resumen PDF de ${MESES[mes]}</button>`;
  $('#v-inicio').innerHTML = h;
}

function renderDias(lista) {
  const nd = new Date(anio, mes + 1, 0).getDate();
  const porDia = new Array(nd).fill(0);
  lista.forEach(g => { porDia[parseInt(g.fecha.slice(8, 10), 10) - 1] += g.montoC; });
  const max = Math.max(...porDia);
  const W = 320, H = 110, base = 92, gap = 2, bw = (W - gap * (nd - 1)) / nd;
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gasto por día">`;
  porDia.forEach((v, i) => {
    const hh = max ? Math.max(v ? 2 : 0, v / max * 84) : 0;
    const x = i * (bw + gap);
    svg += `<rect x="${x.toFixed(1)}" y="${(base - hh).toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="1.5" fill="var(--ink)" opacity="${v ? .75 : 0}"/>`;
  });
  svg += `<line x1="0" x2="${W}" y1="${base + .5}" y2="${base + .5}" stroke="var(--line)"/>`;
  [1, 8, 15, 22, nd].forEach(d => {
    const x = (d - 1) * (bw + gap) + bw / 2;
    svg += `<text class="lbl" x="${x.toFixed(1)}" y="${H - 2}" text-anchor="middle">${d}</text>`;
  });
  svg += '</svg>';
  const esMesActual = anio === ahora.getFullYear() && mes === ahora.getMonth();
  const diasTranscurridos = esMesActual ? ahora.getDate() : nd;
  const total = porDia.reduce((a, b) => a + b, 0);
  return `<div class="card days"><p class="label">Gasto por día</p>${svg}
    <div class="sub-line">Promedio diario: <span class="num">${q(Math.round(total / diasTranscurridos))}</span></div></div>`;
}

function renderBalance() {
  const b = balance();
  const t = totales(gastosDelMes());
  let h = '';

  if (!db.saldoInicial) {
    h += `<div class="notice">Para que el saldo se acumule bien mes a mes, indica con cuánto dinero empezaste.
      <button data-act="saldo-ini">Configurar saldo inicial</button></div>`;
  }

  h += `<div class="card">
    <p class="label">${esMesActual() ? 'Saldo esperado hoy' : 'Saldo final esperado'}</p>
    <p class="big num ${b.final !== null && b.final < 0 ? 'neg' : ''}">${b.final === null ? '—' : q(b.final)}</p>
    <div class="sub-line">Resultado del mes: <span class="num ${b.neto < 0 ? 'neg' : b.neto > 0 ? 'pos' : ''}">${qs(b.neto)}</span></div>
    <div class="ledger">
      <div><span>Saldo al 1 de ${MESES[mes]}</span><span class="num">${b.apertura === null ? '—' : q(b.apertura)}</span></div>
      <div><span>Ingresos</span><span class="num pos">${qs(b.ing)}</span></div>
      <div><span>Gastos</span><span class="num">${q(-b.gas)}</span></div>
      <div class="tot"><span>Saldo final</span><span class="num">${b.final === null ? '—' : q(b.final)}</span></div>
    </div>`;
  if (b.apertura === null) {
    h += `<p class="p" style="margin:10px 0 0">El saldo acumulado empieza en ${nombreClave(b.ini)}. Para este mes solo se muestra lo que entró y salió.</p>`;
  }
  h += '</div>';

  // Cuadre contra el saldo real
  if (b.final !== null) {
    h += '<div class="card"><div class="cat-head"><h2>Cuadre con saldo real</h2></div>';
    if (b.real === null) {
      h += `<p class="p" style="margin-top:8px">Anota cuánto dinero tienes en total, sumando bancos y efectivo, ${esMesActual() ? 'hoy' : 'al cierre de ' + MESES[mes]}. La app lo compara con lo registrado.</p>
        <button class="btn ghost" data-act="saldo-real">Anotar saldo real</button>`;
    } else {
      const d = b.dif;
      const estado = d === 0 ? 'Cuadra' : d < 0 ? 'Faltan ' + q(-d) : 'Sobran ' + q(d);
      const expl = d === 0 ? 'El saldo real coincide con lo registrado.'
        : d < 0 ? 'Tienes menos dinero del que indican los registros. Puede haber gastos sin anotar.'
        : 'Tienes más dinero del que indican los registros. Puede haber ingresos sin anotar.';
      const fr = b.realFecha ? b.realFecha.slice(8, 10) + '/' + b.realFecha.slice(5, 7) : '';
      h += `<span class="estado ${d === 0 ? 'pos' : 'neg'}">${estado}</span>
        <p class="p" style="margin:8px 0 0">${expl}</p>
        <div class="ledger">
          <div><span>Saldo real${fr ? ' <span class="muted" style="font-size:13px">(anotado el ' + fr + ')</span>' : ''}</span><span class="num">${q(b.real)}</span></div>
          <div><span>Saldo según registros</span><span class="num">${q(b.final)}</span></div>
          <div class="tot"><span>Diferencia</span><span class="num ${d === 0 ? '' : 'neg'}">${qs(d)}</span></div>
        </div>
        <button class="btn ghost" data-act="saldo-real" style="margin-top:12px">Actualizar saldo real</button>`;
    }
    h += '</div>';
  }

  // Ingresos por fuente
  const pf = porFuente(ingresosDelMes());
  h += `<div class="card"><div class="cat-head"><h2>Ingresos</h2><span class="amt num pos">${qs(b.ing)}</span></div>`;
  if (!pf.length) h += '<p class="empty">Sin ingresos este mes. Toca + para agregar uno.</p>';
  pf.forEach(([fid, x]) => {
    h += `<div class="row"><div class="row-top"><span>${esc(fuenteNombre(fid))}</span><span class="num">${q(x.total)}</span></div>
      <div class="bar"><span style="width:${x.total * 100 / b.ing}%;background:var(--pos)"></span></div></div>`;
  });
  h += '</div>';

  // Gastos por categoría
  h += `<div class="card"><div class="cat-head"><h2>Gastos</h2><span class="amt num">${q(b.gas)}</span></div>`;
  db.cats.forEach(c => {
    const v = t.cats[c.id].total;
    h += `<div class="row"><div class="row-top"><span><span class="dot" style="background:${color(c.id)}"></span>${esc(c.nombre)}</span><span class="num">${q(v)}</span></div>
      <div class="bar"><span style="width:${b.gas ? v * 100 / b.gas : 0}%;background:${color(c.id)}"></span></div></div>`;
  });
  h += '</div>';

  // Últimos meses
  let filas = '';
  for (let i = 5; i >= 0; i--) {
    let yy = anio, mm = mes - i;
    while (mm < 0) { mm += 12; yy--; }
    const bb = balance(yy, mm);
    if (!bb.ing && !bb.gas) continue;
    filas += `<span>${MESES[mm].slice(0, 3)}</span>
      <span class="r num pos">${bb.ing ? '+' + q(bb.ing) : '—'}</span>
      <span class="r num">${bb.gas ? q(-bb.gas) : '—'}</span>
      <span class="r num">${bb.final === null ? '—' : q(bb.final)}</span>`;
  }
  if (filas) {
    h += `<div class="card"><p class="label">Últimos meses</p><div class="hist">
      <span class="h">Mes</span><span class="h r">Ingresos</span><span class="h r">Gastos</span><span class="h r">Saldo final</span>${filas}</div></div>`;
  }

  h += `<button class="btn" data-act="pdf">Descargar resumen PDF de ${MESES[mes]}</button>`;
  $('#v-balance').innerHTML = h;
}

function renderMovs() {
  let gs = gastosDelMes(), is = ingresosDelMes();
  if (filtro === 'ingresos') gs = [];
  else if (filtro !== 'todas') { gs = gs.filter(g => g.cat === filtro); is = []; }
  const items = gs.map(x => ({ t: 'g', x })).concat(is.map(x => ({ t: 'i', x })))
    .sort((a, b) => b.x.fecha.localeCompare(a.x.fecha) || b.x.creado - a.x.creado);

  let h = '<div class="chips">' +
    [['todas', 'Todos']].concat(db.cats.map(c => [c.id, c.nombre]), [['ingresos', 'Ingresos']]).map(([id, n]) =>
      `<button class="chip ${filtro === id ? 'on' : ''}" data-filtro="${id}">${esc(n)}</button>`).join('') + '</div>';

  if (!items.length) {
    const que = filtro === 'ingresos' ? 'ingresos' : filtro === 'todas' ? 'movimientos' : 'gastos';
    h += `<div class="card"><p class="empty">No hay ${que} en este mes. Toca + para agregar.</p></div>`;
  } else {
    const tg = gs.reduce((a, g) => a + g.montoC, 0), ti = is.reduce((a, i) => a + i.montoC, 0);
    const izq = [gs.length ? `${gs.length} ${gs.length === 1 ? 'gasto' : 'gastos'}` : '', is.length ? `${is.length} ${is.length === 1 ? 'ingreso' : 'ingresos'}` : ''].filter(Boolean).join(' · ');
    const der = [is.length ? qs(ti) : '', gs.length ? q(-tg) : ''].filter(Boolean).join(' · ');
    h += `<div class="day-h" style="text-transform:none"><span>${izq}</span><span class="num">${der}</span></div>`;
    let fechaActual = null;
    items.forEach(({ t, x }) => {
      if (x.fecha !== fechaActual) {
        if (fechaActual) h += '</div>';
        fechaActual = x.fecha;
        const d = new Date(x.fecha + 'T12:00:00');
        const dg = gs.filter(g => g.fecha === x.fecha).reduce((a, g) => a + g.montoC, 0);
        const di = is.filter(i => i.fecha === x.fecha).reduce((a, i) => a + i.montoC, 0);
        const tot = [di ? qs(di) : '', dg ? q(-dg) : ''].filter(Boolean).join(' · ');
        h += `<div class="day-h"><span>${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()].slice(0, 3)}</span><span class="num">${tot}</span></div><div class="list">`;
      }
      if (t === 'g') {
        const c = cat(x.cat);
        h += `<button class="item" data-gasto="${x.id}">
          <span class="sw" style="background:${color(x.cat)}"></span>
          <span class="txt"><div class="t1">${esc(subNombre(c, x.sub))}</div>
          <div class="t2">${esc(c ? c.nombre : '')}${x.nota ? ' · ' + esc(x.nota) : ''}</div></span>
          <span class="amt num">${q(x.montoC)}</span></button>`;
      } else {
        h += `<button class="item" data-ingreso="${x.id}">
          <span class="sw" style="background:var(--pos)"></span>
          <span class="txt"><div class="t1">${esc(fuenteNombre(x.fuente))}</div>
          <div class="t2">Ingreso${x.nota ? ' · ' + esc(x.nota) : ''}</div></span>
          <span class="amt num pos">+${q(x.montoC)}</span></button>`;
      }
    });
    h += '</div>';
  }
  $('#v-movs').innerHTML = h;
}

function renderAjustes() {
  let h = '<div style="height:calc(env(safe-area-inset-top) + 16px)"></div><h1 style="font-size:28px;margin:0 0 14px">Ajustes</h1>';
  h += '<p class="p">Las tres categorías principales son fijas; puedes cambiarles el nombre y administrar sus subcategorías.</p>';
  db.cats.forEach(c => {
    h += `<div class="card" data-cat="${c.id}">
      <div class="cat-head"><h2><span class="dot" style="background:${color(c.id)}"></span>${esc(c.nombre)}</h2>
      <button class="link" data-act="ren-cat">Renombrar</button></div>
      <ul class="subs">`;
    c.subs.forEach(s => {
      const n = db.gastos.filter(g => g.cat === c.id && g.sub === s.id).length;
      h += `<li data-sub="${s.id}"><span class="n">${esc(s.nombre)} <span class="muted" style="font-size:13px">${n ? '· ' + n : ''}</span></span>
        <button class="link" data-act="ren-sub">Editar</button><button class="link del" data-act="del-sub">Quitar</button></li>`;
    });
    h += `</ul><form class="add-sub" data-act="add-sub"><input type="text" placeholder="Nueva subcategoría" maxlength="40"><button>Agregar</button></form></div>`;
  });

  // Fuentes de ingreso
  h += `<div class="card"><div class="cat-head"><h2><span class="dot" style="background:var(--pos)"></span>Fuentes de ingreso</h2></div><ul class="subs">`;
  db.fuentes.forEach(f => {
    const n = db.ingresos.filter(i => i.fuente === f.id).length;
    h += `<li data-fuente="${f.id}"><span class="n">${esc(f.nombre)} <span class="muted" style="font-size:13px">${n ? '· ' + n : ''}</span></span>
      <button class="link" data-act="ren-fuente">Editar</button><button class="link del" data-act="del-fuente">Quitar</button></li>`;
  });
  h += `</ul><form class="add-sub" data-act="add-fuente"><input type="text" placeholder="Nueva fuente" maxlength="40"><button>Agregar</button></form></div>`;

  // Saldo inicial
  const si = db.saldoInicial;
  h += `<div class="card"><div class="cat-head"><h2>Saldo inicial</h2></div>
    <p class="p" style="margin-top:8px">Dinero total, en bancos y efectivo, que tenías al empezar a usar el balance. Cada mes siguiente parte del saldo final del anterior.</p>
    <p class="p">${si ? '<b class="num" style="color:var(--ink)">' + q(si.montoC) + '</b> desde ' + nombreClave(si.mes) : 'Sin configurar. El balance empieza en cero.'}</p>
    <button class="btn ghost" data-act="saldo-ini">${si ? 'Cambiar saldo inicial' : 'Configurar saldo inicial'}</button></div>`;

  const ult = db.ultimoRespaldo ? new Date(db.ultimoRespaldo) : null;
  h += `<div class="card">
    <div class="cat-head"><h2>Copia de seguridad</h2></div>
    <p class="p" style="margin-top:8px">Tus datos se guardan solo en este teléfono. Si borras la app o cambias de teléfono, se pierden. Guarda una copia en iCloud Drive o en Archivos cada cierto tiempo.</p>
    <p class="p">Última copia: ${ult ? ult.getDate() + ' ' + MESES[ult.getMonth()] + ' ' + ult.getFullYear() : 'nunca'}</p>
    <button class="btn" data-act="respaldo">Exportar copia de seguridad</button>
    <button class="btn ghost" data-act="importar">Restaurar desde una copia</button>
  </div>
  <p class="p" style="text-align:center">${db.gastos.length} gastos y ${db.ingresos.length} ingresos guardados en total</p>`;
  $('#v-ajustes').innerHTML = h;
}

/* ---------- Formulario de gasto o ingreso ---------- */
let editando = null, catSel = null, tipoSel = 'gasto';

function ultimoUsado() {
  try { return JSON.parse(localStorage.getItem(KEY_LAST)) || {}; } catch (e) { return {}; }
}

function pintarCats() {
  $('#f-cats').innerHTML = db.cats.map(c =>
    `<button type="button" data-c="${c.id}" class="${c.id === catSel ? 'on' : ''}" style="--cc:${color(c.id)}">${esc(c.nombre)}</button>`).join('');
  const c = cat(catSel);
  $('#f-sub').innerHTML = c.subs.map(s => `<option value="${s.id}">${esc(s.nombre)}</option>`).join('');
}

function pintarTipo() {
  const esG = tipoSel === 'gasto';
  $('#f-tipo').innerHTML = [['gasto', 'Gasto', 'var(--ink)'], ['ingreso', 'Ingreso', 'var(--pos)']].map(([t, n, cc]) =>
    `<button type="button" data-t="${t}" class="${t === tipoSel ? 'on' : ''}" style="--cc:${cc}">${n}</button>`).join('');
  $('#f-tipo').classList.toggle('hidden', !!editando);
  $('#f-wrap-cat').classList.toggle('hidden', !esG);
  $('#f-wrap-sub').classList.toggle('hidden', !esG);
  $('#f-wrap-fuente').classList.toggle('hidden', esG);
  $('#dlg-title').textContent = (editando ? 'Editar ' : 'Nuevo ') + (esG ? 'gasto' : 'ingreso');
  $('#f-del').textContent = 'Eliminar ' + (esG ? 'gasto' : 'ingreso');
  $('#f-nota').placeholder = esG ? 'Ej. almuerzo con cliente' : 'Ej. pago de factura';
}

function abrirMov(tipo, item) {
  editando = item || null;
  tipoSel = tipo;
  const u = ultimoUsado();
  catSel = tipo === 'gasto' && item ? item.cat : (cat(u.cat) ? u.cat : db.cats[0].id);
  pintarCats();
  const subPref = tipo === 'gasto' && item ? item.sub : u.sub;
  if (subPref && cat(catSel).subs.some(s => s.id === subPref)) $('#f-sub').value = subPref;
  $('#f-fuente').innerHTML = db.fuentes.map(f => `<option value="${f.id}">${esc(f.nombre)}</option>`).join('');
  const fPref = tipo === 'ingreso' && item ? item.fuente : u.fuente;
  if (fPref && fuente(fPref)) $('#f-fuente').value = fPref;
  pintarTipo();
  $('#f-monto').value = item ? (item.montoC / 100).toFixed(2) : '';
  $('#f-fecha').value = item ? item.fecha : hoyISO();
  $('#f-nota').value = item ? (item.nota || '') : '';
  $('#f-del').classList.toggle('hidden', !item);
  $('#dlg').showModal();
  if (!item) setTimeout(() => $('#f-monto').focus(), 60);
}

$('#f-tipo').addEventListener('click', e => {
  const b = e.target.closest('button[data-t]'); if (!b) return;
  tipoSel = b.dataset.t; pintarTipo();
});

$('#f-cats').addEventListener('click', e => {
  const b = e.target.closest('button[data-c]'); if (!b) return;
  catSel = b.dataset.c; pintarCats();
});

$('#f-gasto').addEventListener('submit', e => {
  e.preventDefault();
  const montoC = leerMonto($('#f-monto').value);
  if (!montoC) { toast('Escribe un monto válido'); $('#f-monto').focus(); return; }
  const fecha = $('#f-fecha').value;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(fecha)) { toast('Elige una fecha'); return; }
  const nota = $('#f-nota').value.trim();
  const u = ultimoUsado();
  const esG = tipoSel === 'gasto';
  if (esG) {
    const datos = { montoC, fecha, cat: catSel, sub: $('#f-sub').value, nota };
    if (editando) Object.assign(editando, datos);
    else db.gastos.push(Object.assign({ id: uid(), creado: Date.now() }, datos));
    u.cat = datos.cat; u.sub = datos.sub;
  } else {
    const datos = { montoC, fecha, fuente: $('#f-fuente').value, nota };
    if (editando) Object.assign(editando, datos);
    else db.ingresos.push(Object.assign({ id: uid(), creado: Date.now() }, datos));
    u.fuente = datos.fuente;
  }
  guardar();
  try { localStorage.setItem(KEY_LAST, JSON.stringify(u)); } catch (err) {}
  $('#dlg').close();
  const [y, m] = fecha.split('-').map(Number);
  const que = esG ? 'Gasto' : 'Ingreso';

  else toast(que + (editando ? ' actualizado' : ' guardado'));
  render();
});

/* ---------- Ventana para saldos ---------- */
function pedirMonto({ titulo, texto, valor, conMes, mesValor, permitirQuitar }) {
  return new Promise(res => {
    const f = $('#f-saldo'), dlg = $('#dlg-monto');
    f.innerHTML = `<div class="sheet-h"><h3>${esc(titulo)}</h3><button type="button" class="icon-btn" data-x aria-label="Cerrar">×</button></div>
      ${texto ? `<p class="p">${texto}</p>` : ''}
      <input class="amount-in num" name="monto" inputmode="text" placeholder="Q0.00" value="${valor != null ? (valor / 100).toFixed(2) : ''}">
      ${conMes ? `<div class="field"><label>Mes de inicio</label><input type="month" name="mes" value="${mesValor}"></div>` : ''}
      <div class="actions"><button type="submit" class="btn">Guardar</button>${permitirQuitar ? '<button type="button" class="btn danger" data-quitar>Quitar</button>' : ''}</div>`;
    let hecho = false;
    const fin = (v) => { if (hecho) return; hecho = true; if (dlg.open) dlg.close(); res(v); };
    f.onsubmit = e => {
      e.preventDefault();
      const m = leerSaldo(f.elements.monto.value);
      if (m === null) { toast('Escribe un monto válido'); return; }
      const mesV = conMes ? f.elements.mes.value : null;
      if (conMes && !/^\d{4}-\d{2}$/.test(mesV)) { toast('Elige el mes'); return; }
      fin({ montoC: m, mes: mesV });
    };
    f.onclick = e => {
      if (e.target.closest('[data-x]')) fin(null);
      else if (e.target.closest('[data-quitar]')) fin('quitar');
    };
    dlg.onclick = e => { if (e.target === dlg) fin(null); };
    dlg.onclose = () => fin(null);
    dlg.showModal();
    setTimeout(() => f.elements.monto.focus(), 60);
  });
}

/* ---------- Compartir / descargar archivos ---------- */
async function entregarArchivo(blob, nombre) {
  const file = new File([blob], nombre, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: nombre }); return true; }
    catch (e) { if (e.name === 'AbortError') return false; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  return true;
}

/* ---------- Copia de seguridad ---------- */
async function exportarRespaldo() {
  const blob = new Blob([JSON.stringify(db, null, 1)], { type: 'application/json' });
  const ok = await entregarArchivo(blob, 'gastos-respaldo-' + hoyISO() + '.json');
  if (ok) { db.ultimoRespaldo = Date.now(); guardar(); render(); }
}

$('#import-file').addEventListener('change', e => {

    let d;
    try { d = JSON.parse(r.result); } catch (err) { alert('El archivo no es una copia válida.'); return; }
    if (!valido(d)) { alert('El archivo no es una copia válida de esta app.'); return; }
    normalizar(d);
    if (!confirm(`La copia tiene ${d.gastos.length} gastos y ${d.ingresos.length} ingresos. Esto reemplaza todo lo que hay ahora en el teléfono (${db.gastos.length} gastos y ${db.ingresos.length} ingresos). ¿Continuar?`)) return;
    db = d; guardar(); render(); toast('Copia restaurada');
  };
  r.readAsText(file);
});

/* ---------- Resumen PDF: opciones ---------- */
const KEY_PDF = 'misgastos.pdf.v1';
function opcionesPDF() {
  let o = {};

  const ids = db.cats.map(c => c.id);
  const cats = Array.isArray(o.cats) ? o.cats.filter(id => ids.includes(id)) : [];
  return { cats: cats.length ? cats : ids, cons: o.cons !== false, det: o.det !== false, bal: o.bal === true };
}

/* ---------- Resumen PDF: documento ---------- */
function generarPDF(o) {
  if (!window.jspdf) { alert('No se pudo cargar el generador de PDF. Abre la app con internet una vez y vuelve a intentarlo.'); return; }
  const sel = db.cats.filter(c => o.cats.includes(c.id));
  const lista = gastosDelMes().filter(g => o.cats.includes(g.cat))
    .sort((a, b) => a.fecha.localeCompare(b.fecha) || a.creado - b.creado);
  const ingresos = ingresosDelMes().sort((a, b) => a.fecha.localeCompare(b.fecha) || a.creado - b.creado);
  const t = totales(lista);
  const una = sel.length === 1;
  const todas = sel.length === db.cats.length;
  const nombres = sel.map(c => c.nombre).join(' y ');

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'letter' });
  const W = 612, H = 792, M = 50, R = W - M;
  const gris = [110, 113, 109], tinta = [29, 33, 31], linea = [220, 217, 210], verde = [35, 133, 79], rojo = [192, 57, 43];
  let y = M;

  const txt = (s, x, yy, op = {}) => doc.text(String(s), x, yy, op);
  const font = (estilo, tam, col = tinta) => { doc.setFont('helvetica', estilo); doc.setFontSize(tam); doc.setTextColor(...col); };
  const hr = (yy, col = linea, w = 0.6) => { doc.setDrawColor(...col); doc.setLineWidth(w); doc.line(M, yy, R, yy); };
  const espacio = (n) => { if (y + n > H - 60) { doc.addPage(); y = M; return true; } return false; };
  const marcaCol = (col, yy) => { doc.setFillColor(...col); doc.rect(M, yy - 10, 4, 14, 'F'); };
  const marca = (c, yy) => marcaCol(CAT_PDF[idx(c.id)], yy);
  const corta = (s, w) => {
    if (doc.getTextWidth(s) <= w) return s;
    while (s.length && doc.getTextWidth(s + '...') > w) s = s.slice(0, -1);
    return s + '...';
  };

  // Encabezado
  const titulo = o.bal ? 'Resumen financiero' : una ? 'Gastos ' + sel[0].nombre : 'Resumen de gastos';
  font('bold', 20); txt(titulo, M, y + 8);
  font('normal', 13, gris); txt(nombreMes(anio, mes) + (!una && !todas ? ' · ' + nombres : ''), M, y + 28);
  const hoy = new Date();
  font('normal', 9, gris);
  txt('Generado el ' + hoy.getDate() + '/' + (hoy.getMonth() + 1) + '/' + hoy.getFullYear(), R, y + 8, { align: 'right' });
  y += 48; hr(y, tinta, 1); y += 26;

  if (o.bal) {
    const b = balance();
    font('bold', 12); txt('Balance del mes', M, y); y += 10; hr(y); y += 18;
    const fila = (et, val, bold = false, col = tinta) => {
      font(bold ? 'bold' : 'normal', bold ? 12 : 11); txt(et, M, y);
      font(bold ? 'bold' : 'normal', bold ? 12 : 11, col); txt(val, R, y, { align: 'right' });
      y += 9; hr(y, bold ? tinta : linea, bold ? 1 : 0.6); y += 18;
    };
    fila('Saldo al 1 de ' + MESES[mes], b.apertura === null ? 'No aplica' : q(b.apertura));
    fila('Ingresos', qs(b.ing), false, verde);
    fila('Gastos', q(-b.gas));
    fila('Saldo final esperado', b.final === null ? 'No aplica' : q(b.final), true);
    if (b.apertura === null) {
      font('normal', 9, gris); txt('El saldo acumulado empieza en ' + nombreClave(b.ini) + '.', M, y - 6); y += 10;
    }
    if (b.real !== null && b.final !== null) {
      y += 6;
      font('bold', 12); txt('Cuadre con saldo real', M, y); y += 10; hr(y); y += 18;
      fila('Saldo real', q(b.real));
      fila('Saldo según registros', q(b.final));
      const d = b.dif;
      fila(d === 0 ? 'Diferencia (cuadra)' : d < 0 ? 'Diferencia (faltante)' : 'Diferencia (sobrante)', qs(d), true, d === 0 ? tinta : rojo);
    }
    y += 14;

    // Ingresos por fuente
    const pf = porFuente(ingresos);
    espacio(60 + pf.length * 20);
    font('bold', 12); txt('Ingresos por fuente', M, y); y += 20;
    font('bold', 9, gris);
    txt('FUENTE', M, y); txt('INGRESOS', 360, y, { align: 'right' }); txt('TOTAL', 480, y, { align: 'right' }); txt('%', R, y, { align: 'right' });
    y += 8; hr(y); y += 18;
    if (!pf.length) { font('normal', 10, gris); txt('Sin ingresos este mes', M, y); y += 22; }
    pf.forEach(([fid, x]) => {
      espacio(20);
      font('normal', 11);
      txt(fuenteNombre(fid), M, y); txt(x.n, 360, y, { align: 'right' }); txt(q(x.total), 480, y, { align: 'right' });
      txt(pct(x.total, b.ing).toFixed(1) + '%', R, y, { align: 'right' });
      y += 10; hr(y); y += 18;
    });
    if (pf.length) {
      font('bold', 12);
      txt('Total de ingresos', M, y); txt(ingresos.length, 360, y, { align: 'right' }); txt(q(b.ing), 480, y, { align: 'right' }); txt('100%', R, y, { align: 'right' });
      y += 8; hr(y, tinta, 1); y += 18;
    }
    y += 18;
  }

  if (o.cons) {
    // Consolidado por categoría (solo tiene sentido con más de una)
    if (!una) {
      espacio(60 + sel.length * 28);
      font('bold', 12); txt(o.bal ? 'Gastos por categoría' : 'Consolidado por categoría', M, y); y += 20;
      font('bold', 9, gris);
      txt('CATEGORÍA', M, y); txt('GASTOS', 360, y, { align: 'right' }); txt('TOTAL', 480, y, { align: 'right' });
      txt(todas ? '% DEL MES' : '% DEL TOTAL', R, y, { align: 'right' });
      y += 8; hr(y); y += 18;
      sel.forEach(c => {
        const tc = t.cats[c.id];
        doc.setFillColor(...CAT_PDF[idx(c.id)]); doc.rect(M, y - 8, 8, 8, 'F');
        font('normal', 11);
        txt(c.nombre, M + 16, y); txt(tc.n, 360, y, { align: 'right' }); txt(q(tc.total), 480, y, { align: 'right' });
        txt(pct(tc.total, t.total).toFixed(1) + '%', R, y, { align: 'right' });
        y += 10; hr(y); y += 18;
      });
      font('bold', 12);
      txt(o.bal ? 'Total de gastos' : todas ? 'Total del mes' : 'Total', M, y); txt(t.n, 360, y, { align: 'right' }); txt(q(t.total), 480, y, { align: 'right' }); txt('100%', R, y, { align: 'right' });
      y += 8; hr(y, tinta, 1); y += 36;
    }

    // Desglose por subcategoría
    espacio(80);
    font('bold', 12); txt('Desglose por subcategoría', M, y); y += 22;
    sel.forEach(c => {
      const tc = t.cats[c.id];
      const filas = Object.entries(tc.subs).sort((a, b) => b[1].total - a[1].total);
      espacio(40 + filas.length * 20);
      marca(c, y);
      font('bold', 11); txt(c.nombre, M + 12, y);
      font('normal', 9, gris); txt(tc.n + (tc.n === 1 ? ' gasto' : ' gastos'), 360, y, { align: 'right' });
      font('bold', 11); txt(q(tc.total), R, y, { align: 'right' });
      y += 8; hr(y); y += 16;
      if (!filas.length) { font('normal', 10, gris); txt('Sin gastos este mes', M + 12, y); y += 22; return; }
      filas.forEach(([sid, s]) => {
        espacio(20);
        font('normal', 10);
        txt(subNombre(c, sid), M + 12, y);
        font('normal', 10, gris); txt(s.n + (s.n === 1 ? ' gasto' : ' gastos'), 360, y, { align: 'right' });
        font('normal', 10); txt(q(s.total), 480, y, { align: 'right' });
        font('normal', 10, gris); txt(pct(s.total, tc.total).toFixed(1) + '%', R, y, { align: 'right' });
        y += 17;
      });
      y += 14;
    });
  }

  if (o.det) {
    // Detalle, una sección por categoría (y una de ingresos si se incluye el balance)
    if (o.cons || o.bal) { y += 10; espacio(110); }
    font('bold', 12); txt(o.bal ? 'Detalle de movimientos' : 'Detalle de gastos', M, y); y += 24;
    const cols = { fecha: M + 12, sub: M + 62, nota: M + 190 };
    const encabezado = (col2) => {
      font('bold', 8, gris);
      txt('FECHA', cols.fecha, y); txt(col2, cols.sub, y); txt('NOTA', cols.nota, y); txt('MONTO', R, y, { align: 'right' });
      y += 7; hr(y); y += 14;
    };
    const seccion = (nombre, colMarca, col2, movs, nombreFila, total) => {
      const titulo = (cont) => {
        marcaCol(colMarca, y);
        font('bold', 11); txt(nombre + (cont ? ' (continuación)' : ''), M + 12, y); y += 18;
        encabezado(col2);
      };
      espacio(80);
      titulo(false);
      if (!movs.length) { font('normal', 10, gris); txt('Sin movimientos este mes', cols.fecha, y); y += 28; return; }
      movs.forEach(g => {
        if (espacio(16)) titulo(true);
        font('normal', 9);
        txt(g.fecha.slice(8, 10) + '/' + g.fecha.slice(5, 7), cols.fecha, y);
        txt(corta(nombreFila(g), 120), cols.sub, y);
        font('normal', 9, gris); txt(corta(g.nota || '', R - 80 - cols.nota), cols.nota, y);
        font('normal', 9); txt(q(g.montoC), R, y, { align: 'right' });
        y += 15;
      });
      espacio(24);
      y += 1; hr(y, tinta, 0.8); y += 14;
      font('bold', 10); txt('Total ' + nombre, cols.fecha, y); txt(q(total), R, y, { align: 'right' });
      y += 32;
    };
    sel.forEach(c => seccion(c.nombre, CAT_PDF[idx(c.id)], 'SUBCATEGORÍA',
      lista.filter(g => g.cat === c.id), g => subNombre(c, g.sub), t.cats[c.id].total));
    if (o.bal) seccion('Ingresos', verde, 'FUENTE', ingresos, i => fuenteNombre(i.fuente),
      ingresos.reduce((a, i) => a + i.montoC, 0));
    if (!una && !o.cons && !o.bal) {
      espacio(30);
      hr(y - 12, tinta, 1);
      font('bold', 12); txt(todas ? 'Total del mes' : 'Total', M, y + 4); txt(q(t.total), R, y + 4, { align: 'right' });
    }
  }

  // Pie de página
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i);
    font('normal', 8, gris);
    txt(titulo + ' · ' + nombreMes(anio, mes) + (todas ? '' : ' · ' + nombres), M, H - 30);
    txt('Página ' + i + ' de ' + n, R, H - 30, { align: 'right' });
  }

  const slug = (x) => x.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '');
  const partes = [o.cons && 'consolidado', o.det && 'detalle', o.bal && 'balance'].filter(Boolean);
  const nombre = 'Gastos-' + claveMes(anio, mes) +
    (todas ? '' : '-' + sel.map(c => slug(c.nombre)).join('-')) +
    (o.cons && o.det && !o.bal ? '' : '-' + partes.join('-')) + '.pdf';
  entregarArchivo(doc.output('blob'), nombre);
}

/* ---------- Primera vez: nombrar categorías ---------- */
function pedirNombres() {
  const f = $('#f-setup');
  f.innerHTML = `<div class="sheet-h"><h3>Nombra tus categorías</h3></div>
    <p class="p">Estos nombres se guardan solo en este teléfono. Puedes cambiarlos después en Ajustes.</p>` +
    db.cats.map((c, i) => `<div class="field"><label><span class="dot" style="background:${color(c.id)}"></span>Categoría ${i + 1}</label>
      <input type="text" maxlength="30" required data-i="${i}" value="${/^Categoría \d$/.test(c.nombre) ? '' : esc(c.nombre)}"></div>`).join('') +
    '<div class="actions"><button type="submit" class="btn">Empezar</button></div>';
  $('#dlg-setup').showModal();
}
$('#f-setup').addEventListener('submit', e => {
  e.preventDefault();
  const ins = [...$('#f-setup').querySelectorAll('input[data-i]')];
  if (ins.some(i => !i.value.trim())) { toast('Escribe los tres nombres'); return; }
  ins.forEach(i => { db.cats[+i.dataset.i].nombre = i.value.trim(); });
  db.configurado = true; guardar(); $('#dlg-setup').close(); render();
});
$('#dlg-setup').addEventListener('cancel', e => e.preventDefault());

/* ---------- Inicio ---------- */
render();
if (!db.configurado) pedirNombres();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>
